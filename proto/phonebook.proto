syntax = "proto3";

service Phonebook {
    rpc Lookup (LookupRequest) returns (LookupResponse);
    rpc AddEntry (AddEntryRequest) returns (AddEntryResponse);
    rpc GetKey (GetKeyResponse) returns (GetKeyRequest);
}

message LookupRequest {
    string name = 1; 
}

message LookupResponse {
    string number = 1;
    string time = 2;
    bytes signature = 3;
}

message AddEntryRequest {
    string name = 1;
    string number = 2;
}

message AddEntryResponse {
    bool success = 1;
    uint32 id = 2;
    string message = 3;
}

message GetKeyRequest {

}

message GetKeyResponse {
    bytes public_key = 1;
    string format = 2;
}