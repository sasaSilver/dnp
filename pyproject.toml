[project]
name = "dnp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.2",
    "grpcio>=1.71.0",
    "grpcio-tools>=1.71.0",
    "mypy-protobuf>=3.6.0",
    "pydantic-settings>=2.9.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "sqlalchemy[asyncio]>=2.0.40",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test to run with pytest-asyncio",
]
